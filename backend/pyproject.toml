[project]
name = "portfolio-backend"
version = "0.1.0"
description = "FastAPI + LangGraph RAG backend for Reuben's portfolio (Gemini + Supabase pgvector)"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
# Keep in sync with ../requirements.txt (pinned copy that Vercel installs).
dependencies = [
  "fastapi>=0.162.2",
  "uvicorn>=0.54.0",
  "langgraph>=1.2.20",
  "google-genai>=3.0.0",
  "supabase>=2.34.1",
  "pydantic-settings>=2.16.2",
  "python-frontmatter>=1.3.0",
  "pyyaml>=6.0.3",
  "httpx>=0.28.1",
  "resend>=2.52.0",
  "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "pytest-asyncio>=1.4.1",
  "ruff>=0.17.4",
]

[tool.uv]
# This is an application, not a library: `uv sync` installs deps only.
package = false

[tool.pytest.ini_options]
# Code lives in backend/src and is imported as top-level packages (core, llm, rag, tools, agent).
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"] # allow typographic dashes/quotes in strings and comments

[tool.ruff.lint.per-file-ignores]
# Long regex literals read better on one line than split across string concatenations.
"src/agent/guardrails/patterns.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["core", "llm", "rag", "tools", "agent", "services"]
