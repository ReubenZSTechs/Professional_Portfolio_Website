# Re-indexes the chatbot's knowledge whenever site content changes on main.
# Only changed chunks are re-embedded, so this is cheap. Needs three repository secrets:
#   GEMINI_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY  (Settings → Secrets and variables → Actions)
name: Re-index RAG content

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "knowledge/**"
      - "backend/src/rag/**"
      - "backend/scripts/ingest.py"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-embed every chunk (after changing the embedding model or size)"
        type: boolean
        default: false

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      # Until the repository secrets exist (docs/deployment.md), skip instead of failing.
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$GEMINI_API_KEY" ] || [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::notice::Skipping re-index: add GEMINI_API_KEY, SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY as repository secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-python@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.secrets.outputs.ready == 'true'
      - name: Ingest
        if: steps.secrets.outputs.ready == 'true'
        run: python backend/scripts/ingest.py ${{ inputs.force && '--force' || '' }}
