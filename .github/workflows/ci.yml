# Runs on every pull request and push: the site must build and the backend tests must pass.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: these jobs only check out and test code.
permissions:
  contents: read

jobs:
  web:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runtime dependencies only (what ships to Vercel); fails on high or critical advisories.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      # Building also validates every YAML/MDX file in /content against src/lib/schemas.ts.
      - run: npm run build

  api:
    name: Backend (ruff, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-asyncio ruff pip-audit
      # Checks the pinned runtime requirements against PyPI/OSV advisories; any finding fails the job.
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
      - run: ruff check backend api
        working-directory: .
      - run: python -m pytest -q
        working-directory: backend
      - name: Chunk the content (no API calls)
        run: python backend/scripts/ingest.py --dry-run
