# Runs on every pull request and push: the site must build and the backend tests must pass.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Building also validates every YAML/MDX file in /content against src/lib/schemas.ts.
      - run: npm run build

  api:
    name: Backend (ruff, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-asyncio ruff
      - run: ruff check backend api
        working-directory: .
      - run: python -m pytest -q
        working-directory: backend
      - name: Chunk the content (no API calls)
        run: python backend/scripts/ingest.py --dry-run
